<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AERO NEX Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
.login-logo-img{width:260px;max-width:88%;height:auto;display:block;margin:0 auto 16px auto}
</style>
</head>
<body class="login-wrap">
<div class="login-card">
<img class="login-logo-img" src="img/aeronex_rma_logo_transparent.png" alt="AERONEX RMA Portal">
<h1>AERO NEX</h1>
<h2>RMA & Spare Order Portal</h2>
<input id="u" placeholder="Username / Email">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button class="btn-light" onclick="forgotPassword()">Forgot Password?</button>
<div id="msg" class="msg"></div>
<div class="footer">© 2025 AERO NEX<br>Developed by Jocy John<br>Support: support@aeronex.ae</div>
</div>
<script src="config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
